name: Hermes Daily Marketing

on:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC, Monday-Saturday.
    - cron: '30 3 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-daily
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  PRODUCT_REPO_READ_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
  HERMES_INFERENCE_MODEL: ${{ vars.HERMES_INFERENCE_MODEL }}
  HERMES_WRITE_SAFE_ROOT: ${{ github.workspace }}
  HERMES_REDACT_SECRETS: 'true'
  HERMES_PROMPT: |
    You are the autonomous marketing intelligence operator for the repository you are currently working in.

    MODE: DAILY

    Primary workspace: the current checkout.
    Current product repositories:
    - /tmp/keanso
    - /tmp/aibid

    Read the workspace policy and brand knowledge before doing anything else:
    - hermes/policies/marketing-policy.md
    - hermes/skills/weekly-research/SKILL.md
    - hermes/skills/daily-operations/SKILL.md
    - hermes/research/SOURCES.md
    - brands/keanso/product.md
    - brands/keanso/audience.md
    - brands/ai-bid/product.md
    - brands/ai-bid/audience.md

    Task:
    1. Inspect the latest strategy and previous execution reports if they exist.
    2. Verify any product facts needed for today's work against the current repositories and public production sites.
    3. Perform focused market/community research only where it can change today's decision.
    4. Produce safe, channel-specific draft content or execution plans for the highest-priority opportunities.
    5. Do NOT publish, like, follow, comment, reply, DM, submit directories, or spend money. This run is planning/drafting only until publishing integrations are explicitly enabled.
    6. Write the daily report to reports/daily/YYYY-MM-DD.md using today's date.
    7. If useful, update reports/latest/strategy.md, but never delete historical evidence.
    8. Write a compact machine-readable state file to state/latest.json.
    9. Include source URLs and confidence for material findings.
    10. Never invent metrics, customers, testimonials, features, or outcomes.

    Keep the run bounded and useful. Do not spend time on generic SEO content or low-value research. If no safe action is justified, write NO_EXECUTABLE_ACTIONS with the reason.

jobs:
  research-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout marketing workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required configuration
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$PRODUCT_REPO_READ_TOKEN" ]; then
            echo "PRODUCT_REPO_READ_TOKEN is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$HERMES_INFERENCE_MODEL" ]; then
            echo "HERMES_INFERENCE_MODEL is not configured in repository variables."
            echo "Set it to an OpenRouter model identifier before running Hermes."
            exit 1
          fi

      - name: Clone current product repositories
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
        run: |
          gh repo clone techykaif/Keanso /tmp/keanso -- --depth 1
          gh repo clone techykaif/aibid /tmp/aibid -- --depth 1

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          source "$HOME/.bashrc" || true
          command -v hermes
          hermes --version

      - name: Run bounded daily intelligence
        run: |
          source "$HOME/.bashrc" || true
          hermes -z "$HERMES_PROMPT" --provider openrouter --model "$HERMES_INFERENCE_MODEL" --usage-file /tmp/hermes-usage.json

      - name: Save usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-daily-usage
          path: /tmp/hermes-usage.json
          if-no-files-found: ignore

      - name: Commit intelligence state
        run: |
          git config user.name "hermes-marketing[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if git diff --cached --quiet; then
            echo "No intelligence changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily marketing intelligence"
          git push
