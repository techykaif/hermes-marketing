name: Hermes Daily Marketing

on:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC, Monday-Saturday.
    - cron: '30 3 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-daily
  cancel-in-progress: false

env:
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  PRODUCT_REPO_READ_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
  HERMES_WRITE_SAFE_ROOT: ${{ github.workspace }}
  HERMES_REDACT_SECRETS: 'true'
  HERMES_PROMPT: |
    You are the autonomous marketing intelligence operator for the repository you are currently working in.

    MODE: DAILY

    Primary workspace: the current checkout.
    Current product repositories:
    - /tmp/keanso
    - /tmp/aibid

    Read the workspace policy and brand knowledge before doing anything else:
    - hermes/policies/marketing-policy.md
    - hermes/skills/weekly-research/SKILL.md
    - hermes/skills/daily-operations/SKILL.md
    - hermes/research/SOURCES.md
    - brands/keanso/product.md
    - brands/keanso/audience.md
    - brands/ai-bid/product.md
    - brands/ai-bid/audience.md

    Task:
    1. Inspect the latest strategy and previous execution reports if they exist.
    2. Verify only the product facts needed for today's decision against the current repositories and public production sites.
    3. Perform focused market/community research only where it can change today's decision.
    4. Produce safe, channel-specific draft content or execution plans for the highest-priority opportunities.
    5. Do NOT publish, like, follow, comment, reply, DM, submit directories, or spend money. This run is planning/drafting only.
    6. Write the daily report to reports/daily/YYYY-MM-DD.md using today's date.
    7. If useful, update reports/latest/strategy.md, but never delete historical evidence.
    8. Write a compact machine-readable state file to state/latest.json.
    9. Include source URLs and confidence for material findings.
    10. Never invent metrics, customers, testimonials, features, or outcomes.

    RUNTIME DISCIPLINE:
    - Complete the task in a small number of deliberate steps; do not wander.
    - Prefer direct repository inspection and a few high-value web searches over broad browsing.
    - Do not use browser automation unless absolutely necessary; web search/extraction is preferred.
    - Stop researching once you have enough evidence to make the decision.
    - Produce the files even if some optional research sources fail.
    - If no safe action is justified, write NO_EXECUTABLE_ACTIONS with the reason.

jobs:
  research-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout marketing workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required configuration
        run: |
          if [ -z "$PRODUCT_REPO_READ_TOKEN" ]; then
            echo "PRODUCT_REPO_READ_TOKEN is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$CEREBRAS_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No inference provider key is configured. Add CEREBRAS_API_KEY (preferred) or OPENROUTER_API_KEY (last-resort fallback)."
            exit 1
          fi

      - name: Clone current product repositories
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
        run: |
          gh repo clone techykaif/Keanso /tmp/keanso -- --depth 1
          gh repo clone techykaif/aibid /tmp/aibid -- --depth 1

      - name: Restore Hermes Agent installation cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.hermes/hermes-agent
            ~/.hermes/tools
            ~/.local/bin/hermes
          key: hermes-agent-${{ runner.os }}-v1

      - name: Install Hermes Agent if cache is cold
        run: |
          if [ -x "$HOME/.hermes/hermes-agent/venv/bin/hermes" ]; then
            echo "Using cached Hermes Agent installation."
          else
            echo "Hermes cache miss; installing Hermes Agent."
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          fi
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes --version

      - name: Configure native Hermes provider fallback chain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cat > "$HOME/.hermes/config.yaml" <<'YAML'
          agent:
            max_turns: 12
            run_budget_seconds: 1200
            disabled_toolsets:
              - browser
              - vision
              - video
              - image_gen
              - tts
              - messaging
              - spotify
              - discord
              - discord_admin
              - homeassistant
              - cronjob
              - delegation
              - code_execution
              - memory
              - session_search
              - todo
              - clarify
          model:
            provider: custom
            default: gpt-oss-120b
            base_url: https://api.cerebras.ai/v1
            key_env: CEREBRAS_API_KEY
          fallback_providers:
            - provider: opencode-free
              model: deepseek-v4-flash-free
            - provider: openrouter
              model: openrouter/free
          YAML
          hermes config check

      - name: Run daily intelligence
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -f /tmp/hermes-usage.json
          hermes -z "$HERMES_PROMPT" --usage-file /tmp/hermes-usage.json

      - name: Validate Hermes result
        run: |
          if [ ! -s /tmp/hermes-usage.json ]; then
            echo "Hermes did not produce a usage report."
            exit 1
          fi
          cat /tmp/hermes-usage.json
          if jq -e '.failed == true or .completed != true' /tmp/hermes-usage.json >/dev/null; then
            echo "Hermes execution did not complete successfully."
            exit 1
          fi
          report="reports/daily/$(date -u +%F).md"
          if [ ! -s "$report" ]; then
            echo "Expected daily report is missing: $report"
            exit 1
          fi
          if [ ! -s state/latest.json ]; then
            echo "Expected state file is missing: state/latest.json"
            exit 1
          fi

      - name: Save usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-daily-usage
          path: /tmp/hermes-usage.json
          if-no-files-found: ignore

      - name: Commit intelligence state
        run: |
          git config user.name "hermes-marketing[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No workspace changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily marketing intelligence"
          git push
