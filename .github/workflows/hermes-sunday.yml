name: Hermes Sunday Intelligence

on:
  schedule:
    # 10:30 Asia/Kolkata = 05:00 UTC.
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-sunday
  cancel-in-progress: false

env:
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  PRODUCT_REPO_READ_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
  HERMES_WRITE_SAFE_ROOT: ${{ github.workspace }}
  HERMES_REDACT_SECRETS: 'true'
  HERMES_PROMPT: |
    You are the Sunday intelligence operator for the autonomous marketing workspace.

    MODE: SUNDAY INTELLIGENCE ONLY

    Product repositories:
    - /tmp/keanso
    - /tmp/aibid

    Read before research:
    - hermes/policies/marketing-policy.md
    - hermes/policies/sunday-mode.md
    - hermes/skills/weekly-research/SKILL.md
    - hermes/research/SOURCES.md
    - brands/keanso/product.md
    - brands/keanso/audience.md
    - brands/ai-bid/product.md
    - brands/ai-bid/audience.md

    Perform the weekly intelligence cycle, but keep it decision-oriented:
    1. Verify the current public state of Keanso and AI-Bid.
    2. Inspect current repository implementation and relevant implementation-status documents.
    3. Detect meaningful product changes since previous reports.
    4. Research only the most relevant competitor, market, and customer-pain changes.
    5. Review previous intelligence and execution reports.
    6. Identify what worked, what failed, and what remains unknown. Never invent analytics.
    7. Check the health of this marketing repository and scheduled automation configuration.
    8. Produce a prioritized strategy for the coming week.
    9. Record evidence, source URLs, timestamps, confidence, and whether each conclusion is verified or inferred.

    HARD SUNDAY RULE:
    Do not publish or schedule social posts. Do not comment, reply, DM, like, follow, submit directories, contact prospects, launch ads, or spend money. Sunday is research, verification, analytics processing, maintenance, and planning only.

    Write these outputs:
    - reports/latest/keanso.md
    - reports/latest/ai-bid.md
    - reports/latest/market.md
    - reports/latest/strategy.md
    - reports/latest/system.md
    - reports/weekly/YYYY-MM-DD.md
    - state/latest.json

    RUNTIME DISCIPLINE:
    - Use a small number of deliberate research passes; do not wander.
    - Prefer repository inspection and high-value web search/extraction over browser automation.
    - Stop researching once the weekly strategy is defensible.
    - Produce the reports even if optional sources fail.
    - Preserve historical reports and never guess when a source is unavailable.

jobs:
  weekly-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout marketing workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required configuration
        run: |
          if [ -z "$PRODUCT_REPO_READ_TOKEN" ]; then
            echo "PRODUCT_REPO_READ_TOKEN is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$CEREBRAS_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No inference provider key is configured. Add CEREBRAS_API_KEY (preferred) or OPENROUTER_API_KEY (last-resort fallback)."
            exit 1
          fi

      - name: Clone current product repositories
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_REPO_READ_TOKEN }}
        run: |
          gh repo clone techykaif/Keanso /tmp/keanso -- --depth 1
          gh repo clone techykaif/aibid /tmp/aibid -- --depth 1

      - name: Restore Hermes Agent installation cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.hermes/hermes-agent
            ~/.hermes/tools
            ~/.local/bin/hermes
          key: hermes-agent-${{ runner.os }}-v1

      - name: Install Hermes Agent if cache is cold
        run: |
          if [ -x "$HOME/.hermes/hermes-agent/venv/bin/hermes" ]; then
            echo "Using cached Hermes Agent installation."
          else
            echo "Hermes cache miss; installing Hermes Agent."
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          fi
          export PATH="$HOME/.local/bin:$PATH"
          command -v hermes
          hermes --version

      - name: Configure native Hermes provider fallback chain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cat > "$HOME/.hermes/config.yaml" <<'YAML'
          agent:
            max_turns: 20
            run_budget_seconds: 1800
            disabled_toolsets:
              - browser
              - vision
              - video
              - image_gen
              - tts
              - messaging
              - spotify
              - discord
              - discord_admin
              - homeassistant
              - cronjob
              - delegation
              - code_execution
              - memory
              - session_search
              - todo
              - clarify
          model:
            provider: custom
            default: gpt-oss-120b
            base_url: https://api.cerebras.ai/v1
            key_env: CEREBRAS_API_KEY
          fallback_providers:
            - provider: opencode-free
              model: deepseek-v4-flash-free
            - provider: openrouter
              model: openrouter/free
          YAML
          hermes config check

      - name: Run Sunday intelligence
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -f /tmp/hermes-usage.json
          hermes -z "$HERMES_PROMPT" --usage-file /tmp/hermes-usage.json

      - name: Validate Hermes result
        run: |
          if [ ! -s /tmp/hermes-usage.json ]; then
            echo "Hermes did not produce a usage report."
            exit 1
          fi
          cat /tmp/hermes-usage.json
          if jq -e '.failed == true or .completed != true' /tmp/hermes-usage.json >/dev/null; then
            echo "Hermes execution did not complete successfully."
            exit 1
          fi
          required_reports=(
            reports/latest/keanso.md
            reports/latest/ai-bid.md
            reports/latest/market.md
            reports/latest/strategy.md
            reports/latest/system.md
            reports/weekly/$(date -u +%F).md
          )
          for report in "${required_reports[@]}"; do
            if [ ! -s "$report" ]; then
              echo "Expected weekly report is missing: $report"
              exit 1
            fi
          done
          if [ ! -s state/latest.json ]; then
            echo "Expected state file is missing: state/latest.json"
            exit 1
          fi

      - name: Save usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-sunday-usage
          path: /tmp/hermes-usage.json
          if-no-files-found: ignore

      - name: Commit weekly intelligence
        run: |
          git config user.name "hermes-marketing[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No workspace changes to commit."
            exit 0
          fi
          git commit -m "chore: update weekly marketing intelligence"
          git push
